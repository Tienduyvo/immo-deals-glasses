<html lang="de"><head><meta charset="utf-8">

<title>Immo-Deal-Scanner Frankfurt – Dashboard</title>
<style>
  :root{--bg:#f4f6f9;--card:#fff;--ink:#1f2937;--mut:#6b7280;--line:#e5e7eb;--accent:#1F4E79;--good:#0a7d33;--warn:#b45309;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,Segoe UI,Roboto,sans-serif}
  header{background:var(--accent);color:#fff;padding:16px 22px}
  header h1{margin:0;font-size:18px}
  header .sub{opacity:.8;font-size:12px;margin-top:3px}
  .wrap{padding:18px 22px}
  .kpis{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:14px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 16px;min-width:140px}
  .kpi .v{font-size:22px;font-weight:700}
  .kpi .l{font-size:12px;color:var(--mut)}
  .filters{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 16px;display:flex;flex-wrap:wrap;gap:14px;align-items:end;margin-bottom:14px}
  .filters label{display:flex;flex-direction:column;font-size:12px;color:var(--mut);gap:4px}
  .filters input,.filters select{font-size:14px;padding:6px 8px;border:1px solid var(--line);border-radius:7px;background:#fff}
  .filters button{padding:7px 12px;border:1px solid var(--line);background:#fff;border-radius:7px;cursor:pointer}
  .tablewrap{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:auto}
  table{border-collapse:collapse;width:100%;font-size:13px}
  th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
  th{position:sticky;top:0;background:#eef2f7;cursor:pointer;user-select:none}
  th.sorted::after{content:" \25B2";font-size:10px}
  th.sorted.desc::after{content:" \25BC"}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  tr.neu td{background:#fff8e1}
  tr:hover td{background:#f0f6ff}
  .pill{display:inline-block;font-size:11px;padding:1px 6px;border-radius:20px;margin-right:3px}
  .zv{background:#ede9fe;color:#5b21b6}
  .erb{background:#fef3c7;color:#92400e}
  .alt{background:#e0f2fe;color:#075985}
  .gew{background:#e2e8f0;color:#334155}
  .neuflag{background:#dcfce7;color:#166534}
  .rendite{font-weight:700;color:var(--good)}
  .hidebtn{border:1px solid #d0d7de;background:#f6f8fa;color:#57606a;border-radius:6px;padding:2px 8px;cursor:pointer;font-size:12px;white-space:nowrap}
  .hidebtn:hover{background:#ffebe9;color:#cf222e;border-color:#ffcfcb}
  #hiddeninfo a{cursor:pointer}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}
  .muted{color:var(--mut);font-size:12px}
  .count{color:var(--mut);font-size:12px;margin:8px 2px}
</style></head>

<header>

  <div class="count" id="hiddeninfo"></div>

hschnittlich", "tage": 0, "zv": false, "erbbau": false, "neu": true, "typ": "Wohnen", "faktor": null, "ort": "unbekannt", "az": "", "ag": "", "titel": "Neubau-EFH in ruhiger und gepflegter Wohngegend", "link": "https://www.kleinanzeigen.de/s-anzeige/2763633912", "gutachten": ""}];
const KPI = {"aktiv": 1490, "neu": 1249, "avg": 7882, "generated": "2026-08-05T10:19:56", "age_thr": 60};
const HIDE_KEY = "immo_hidden_urls";
let hidden = new Set();
try { hidden = new Set(JSON.parse(localStorage.getItem(HIDE_KEY) || "[]")); } catch(e) {}
function saveHidden(){ try { localStorage.setItem(HIDE_KEY, JSON.stringify([...hidden])); } catch(e) {} }
const COLS = [
  {k:"eur_sqm", t:"€/m²", num:true, fmt:v=>v==null?"–":'<span class="rendite">'+v.toLocaleString('de-DE')+' €/m²</span>'},
  {k:"preis", t:"Preis", num:true, fmt:v=>v==null?"–":v.toLocaleString('de-DE')+' €'},
  {k:"sqm", t:"m²", num:true, fmt:v=>v==null?"–":v.toLocaleString('de-DE')},
  {k:"quelle", t:"Quelle", num:false, fmt:v=>v||""},
  {k:"stadtteil", t:"Stadtteil/Ort", num:false, fmt:v=>v||""},
  {k:"lage", t:"Lage", num:true, fmt:v=>v==null?"–":('★'.repeat(v)+' '+v+'/5')},
  {k:"anbindung", t:"Anbindung", num:false, fmt:v=>v||""},
  {k:"tage", t:"Tage", num:true, fmt:v=>v==null?"–":v.toLocaleString('de-DE')},
  {k:"flags", t:"Flags", num:false, fmt:(_,r)=>flagsHtml(r)},
  {k:"objekt", t:"Objekt / Link", num:false, fmt:(_,r)=>objektHtml(r)},
  {k:"hide", t:"", num:false, fmt:(_,r)=>'<button class="hidebtn" data-url="'+encodeURIComponent(r.link||"")+'" title="Ausblenden – bereits gesehen">✕ gesehen</button>'},
];
let sortK="eur_sqm", sortDesc=false;

function flagsHtml(r){
  let s="";
  if(r.typ==='Gewerbe'){ s+='<span class="pill gew">🏢 Gewerbe/Gastro</span>'; if(r.faktor!=null) s+='<span class="pill gew">Faktor '+r.faktor+'×</span>'; }
  if(r.zv) s+='<span class="pill zv">⚖️ ZV</span>';
  if(r.erbbau) s+='<span class="pill erb">⚠️ Erbpacht</span>';
  if(r.tage!=null && r.tage>=KPI.age_thr) s+='<span class="pill alt">🕰️ lange online</span>';
  if(r.neu) s+='<span class="pill neuflag">🆕 neu</span>';
  return s||'<span class="muted">–</span>';
}
function esc(s){return (s||"").replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function objektHtml(r){
  const t=esc(r.titel).slice(0,70);
  if(r.zv){
    let s='<b>'+t+'</b><br><span class="muted">'+esc(r.ag||'AG Frankfurt a.M.')+' · Az '+esc(r.az||'?')+'</span>';
    if(r.link) s+=' · <a href="'+r.link+'" target="_blank" rel="noopener">Portal↗</a>';
    if(r.gutachten) s+=' · <a href="'+r.gutachten+'" target="_blank">Gutachten-PDF</a>';
    return s;
  }
  return '<a href="'+r.link+'" target="_blank" rel="noopener">'+t+' ↗</a>';
}
function activeFilters(){
  const mr=parseFloat(document.getElementById('fEurM2').value);
  const ml=parseInt(document.getElementById('fLage').value);
  const q=document.getElementById('fQuelle').value;
  const zv=document.getElementById('fZV').value;
  const ty=document.getElementById('fTyp').value;
  const ort=document.getElementById('fOrt').value;
  const mp=parseFloat(document.getElementById('fPreis').value);
  const showNo=document.getElementById('fNoM2').checked;
  return DATA.filter(r=>{
    if(hidden.has(r.link)) return false;
    if(!showNo && r.eur_sqm==null) return false;
    if(!isNaN(mr) && (r.eur_sqm==null || r.eur_sqm>mr)) return false;
    if(!isNaN(ml) && (r.lage==null || r.lage<ml)) return false;
    if(q && r.quelle!==q) return false;
    if(zv==="1" && !r.zv) return false;
    if(zv==="0" && r.zv) return false;
    if(ty && (r.typ||'Wohnen')!==ty) return false;
    if(ort==="__ffm__" && (r.ort||"")!=="Frankfurt") return false;
    if(ort==="__umland__" && ((r.ort||"")==="Frankfurt" || (r.ort||"")==="unbekannt" || !r.ort)) return false;
    if(ort==="__unk__" && (r.ort||"unbekannt")!=="unbekannt") return false;
    if(ort && !ort.startsWith("__") && (r.ort||"")!==ort) return false;
    if(!isNaN(mp) && (r.preis==null || r.preis>mp)) return false;
    return true;
  });
}
function render(){
  const head=document.getElementById('head'); head.innerHTML="";
  COLS.forEach(c=>{
    const th=document.createElement('th'); th.textContent=c.t;
    if(c.num) th.classList.add('num');
    if(c.k===sortK){th.classList.add('sorted'); if(sortDesc) th.classList.add('desc');}
    if(c.k!=="flags"&&c.k!=="objekt") th.onclick=()=>{ if(sortK===c.k) sortDesc=!sortDesc; else {sortK=c.k; sortDesc=c.num;} render(); };
    head.appendChild(th);
  });
  let rows=activeFilters();
  rows.sort((a,b)=>{
    let x=a[sortK], y=b[sortK];
    if(x==null) return 1; if(y==null) return -1;
    if(typeof x==='number') return sortDesc?y-x:x-y;
    return sortDesc? String(y).localeCompare(String(x)) : String(x).localeCompare(String(y));
  });
  const body=document.getElementById('body'); body.innerHTML="";
  rows.forEach(r=>{
    const tr=document.createElement('tr'); if(r.neu) tr.className="neu";
    COLS.forEach(c=>{
      const td=document.createElement('td'); if(c.num) td.classList.add('num');
      td.innerHTML = c.k==="flags"||c.k==="objekt" ? c.fmt(null,r) : c.fmt(r[c.k],r);
      tr.appendChild(td);
    });
    body.appendChild(tr);
  });
  const noM2=DATA.filter(r=>r.eur_sqm==null).length;
  const showNo2=document.getElementById('fNoM2').checked;
  document.getElementById('count').textContent = rows.length+" von "+DATA.length+" Objekten"+((!showNo2&&noM2)?(" · "+noM2+" ohne €/m² ausgeblendet"):"");
  document.getElementById('hiddeninfo').innerHTML = hidden.size ? (hidden.size+' als gesehen ausgeblendet · <a id="unhideall">alle wieder einblenden</a>') : '';
}
function initKPIs(){
  document.getElementById('stand').textContent = "Stand: "+ (KPI.generated||"").replace('T',' ').slice(0,16) + " · aktive Objekte";
  document.getElementById('thr').textContent = KPI.age_thr;
  const k=document.getElementById('kpis');
  const items=[["Aktive Objekte",KPI.aktiv.toLocaleString('de-DE')],
    ["Neu seit letztem Lauf",KPI.neu.toLocaleString('de-DE')],
    ["Ø €/m²",KPI.avg.toLocaleString('de-DE')+' €/m²']];
  k.innerHTML=items.map(i=>'<div class="kpi"><div class="v">'+i[1]+'</div><div class="l">'+i[0]+'</div></div>').join("");
  const sel=document.getElementById('fQuelle');
  [...new Set(DATA.map(r=>r.quelle))].sort().forEach(q=>{const o=document.createElement('option');o.textContent=q;sel.appendChild(o);});
  const selO=document.getElementById('fOrt');
  selO.insertAdjacentHTML('beforeend','<option value="__ffm__">Nur Frankfurt</option><option value="__umland__">Nur Umland</option><option value="__unk__">Ohne verifizierten Ort</option>');
  [...new Set(DATA.map(r=>r.ort).filter(o=>o && o!=="Frankfurt" && o!=="unbekannt"))].sort()
    .forEach(o=>{const el=document.createElement('option');el.value=o;el.textContent="  "+o;selO.appendChild(el);});
}
["fEurM2","fLage","fQuelle","fZV","fTyp","fOrt","fPreis"].forEach(id=>document.getElementById(id).addEventListener('input',render));
document.getElementById('fNoM2').addEventListener('change',render);
document.getElementById('reset').onclick=()=>{["fEurM2","fLage","fQuelle","fZV","fTyp","fOrt","fPreis"].forEach(id=>document.getElementById(id).value="");document.getElementById('fNoM2').checked=false;render();};
// "gesehen" wirkt IMMER lokal (localStorage). Der Sync mit der zentralen DB läuft über
// den Hub (localhost:8377) — von unterwegs nicht erreichbar (bzw. Mixed-Content auf https).
// Deshalb: Warteschlange in localStorage, die im Heimnetz automatisch nachsynchronisiert.
const HUB="http://localhost:8377/seen";
const QKEY="immo_seen_queue";       // [{url, unseen}]
function loadQ(){ try{ return JSON.parse(localStorage.getItem(QKEY)||"[]"); }catch(e){ return []; } }
function saveQ(q){ try{ localStorage.setItem(QKEY, JSON.stringify(q)); }catch(e){} }
function hubPost(payload){
  return fetch(HUB,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)})
         .then(r=>r && r.ok);
}
function enqueue(item){ const q=loadQ(); q.push(item); saveQ(q); syncNote(); }
function markSeen(u){
  hidden.add(u); saveHidden(); render();
  hubPost({url:u}).then(ok=>{ if(!ok) throw 0; syncNote(); })
                  .catch(()=>enqueue({url:u}));
}
function markUnseen(urls){
  hidden.clear(); saveHidden(); render();
  hubPost({urls:urls, unseen:true}).then(ok=>{ if(!ok) throw 0; syncNote(); })
                  .catch(()=>enqueue({urls:urls, unseen:true}));
}
function flushQueue(){
  const q=loadQ(); if(!q.length){ syncNote(); return; }
  // alle offenen Markierungen nacheinander versuchen; bei Erfolg aus der Queue nehmen
  (async()=>{
    const rest=[];
    for(const it of q){ try{ const ok=await hubPost(it); if(!ok) rest.push(it); }catch(e){ rest.push(it); } }
    saveQ(rest); syncNote();
  })();
}
// Alt-Ausblendungen (nur lokal im Browser) einmalig in die DB heben, damit Desktop und
// öffentliche Seite dieselben Objekte ausblenden. Läuft nur, wenn der Hub erreichbar ist
// (Heimnetz); bereits synchronisierte URLs werden gemerkt und nicht erneut gesendet.
const SKEY="immo_hidden_synced";
function loadSynced(){ try{ return new Set(JSON.parse(localStorage.getItem(SKEY)||"[]")); }catch(e){ return new Set(); } }
function saveSynced(s){ try{ localStorage.setItem(SKEY, JSON.stringify([...s])); }catch(e){} }
function syncHiddenToDB(){
  const synced=loadSynced();
  const pending=[...hidden].filter(u=>u && !synced.has(u));
  if(!pending.length) return;
  hubPost({urls:pending}).then(ok=>{ if(ok){ pending.forEach(u=>synced.add(u)); saveSynced(synced); } }).catch(()=>{});
}
function syncNote(){
  const n=loadQ().length; const el=document.getElementById('syncnote');
  el.textContent = n ? ("🔄 "+n+" ‚gesehen'-Markierung(en) lokal gespeichert – werden im Heimnetz automatisch mit der Datenbank synchronisiert.") : "";
}
document.getElementById('body').addEventListener('click',e=>{
  const b=e.target.closest('.hidebtn');
  if(b){ const u=decodeURIComponent(b.getAttribute('data-url')||''); if(u){ markSeen(u); } }
});
document.getElementById('hiddeninfo').addEventListener('click',e=>{
  if(e.target.id==='unhideall'){ markUnseen([...hidden]); }
});
initKPIs(); render(); flushQueue(); syncHiddenToDB();
</script>
